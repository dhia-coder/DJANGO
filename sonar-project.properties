# SonarQube Configuration for Angular Admin
sonar.projectKey=my-angular-admin
sonar.organization=my-org
sonar.host.url=http://localhost:9000
sonar.login=squ_b85eebb6c1152f1cebf340004b4d7fcbc4507088

# Project Information
sonar.projectName=Angular Admin Dashboard
sonar.projectVersion=1.0

# Source files
sonar.sources=src

# Exclude test files, node_modules, dist, etc.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/cypress/**

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test settings
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate
sonar.qualitygate.wait=true

# Additional settings for Angular
sonar.typescript.file.suffixes=.ts
sonar.javascript.file.suffixes=.js
